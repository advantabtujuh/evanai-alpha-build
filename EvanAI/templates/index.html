<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvanAI Gen-4 | Solo Dev Edition</title>
    <style>
        :root { --bg: #0b0e14; --panel: #151921; --accent: #4f46e5; --text: #e2e8f0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 260px; background: var(--panel); border-right: 1px solid #2d3748; padding: 20px; display: flex; flex-direction: column; }
        #main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        #messages { flex: 1; overflow-y: auto; padding: 40px 20% 100px 20%; display: flex; flex-direction: column; gap: 24px; }
        .bubble { max-width: 85%; line-height: 1.6; font-size: 15px; position: relative; }
        .ai { color: var(--text); }
        .user { color: #a5b4fc; font-weight: 500; }
        .status-tag { font-size: 10px; text-transform: uppercase; opacity: 0.5; margin-bottom: 4px; display: block; }

        #input-wrapper { position: absolute; bottom: 0; width: 100%; padding: 40px 0; background: linear-gradient(transparent, var(--bg) 50%); }
        .input-box { width: 60%; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; display: flex; padding: 8px 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        input { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-size: 16px; }
        
        .badge { background: var(--accent); padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="font-size: 18px; color: var(--accent);">EVAN AI <span style="font-size: 10px; color: grey;">V4.0(ALPHA)</span></h2>
    <p style="font-size: 12px; color: #64748b;">Project: Son of Generation</p>
    <div id="stats" class="badge">Awaiting Data...</div>
</div>

<div id="main-chat">
    <div id="messages">
        <div class="bubble ai">
            <span class="status-tag">System Ready</span>
            Hello, Tedi Wildan. Neural link established. How shall we proceed with development today?
        </div>
    </div>

    <div id="input-wrapper">
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Message EvanAI..." autocomplete="off">
        </div>
    </div>
</div>

<script>
    const input = document.getElementById("user-input");
    const container = document.getElementById("messages");
    let isTeaching = false;
    let lastQuery = "";

    input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSend();
    });

    async function handleSend() {
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = "";

        const endpoint = isTeaching ? '/teach' : '/chat';
        const payload = isTeaching ? {question: lastQuery, answer: text} : {message: text};

        const response = await fetch(endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        addMessage(data.reply, 'ai', data.status);

        if (data.status === "learn") {
            isTeaching = true;
            lastQuery = text;
        } else {
            isTeaching = false;
        }
    }

    function addMessage(text, sender, status = "") {
        const div = document.createElement("div");
        div.className = `bubble ${sender}`;
        const tag = status ? `<span class="status-tag">${status}</span>` : "";
        div.innerHTML = `${tag}${text}`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
</script>
</body>
</html>
